# Репетитор из Коми · запуск базы + API одной командой:
#   docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: komi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: komi
      POSTGRES_PASSWORD: komi_secret
      POSTGRES_DB: repetytor
    ports:
      - "5432:5432"
    volumes:
      - komi_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U komi -d repetytor"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: komi-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://komi:komi_secret@db:5432/repetytor
      HMAC_SECRET: ${HMAC_SECRET:-dev-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-daniil}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Pudov-Ege-2026}
      ADMIN_TEACHER_CODE: ${ADMIN_TEACHER_CODE:-SYSOLA-PRO}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-Даниил Андреевич Пудов}
    ports:
      - "8000:8000"

volumes:
  komi_pg
