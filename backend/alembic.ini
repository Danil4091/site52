# Alembic · Репетитор из Коми
# URL базы берётся из окружения (DATABASE_URL) — см. alembic/env.py.

[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url намеренно не задан здесь: его подставляет env.py из DATABASE_URL,
# чтобы секрет не лежал в ini-файле.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
